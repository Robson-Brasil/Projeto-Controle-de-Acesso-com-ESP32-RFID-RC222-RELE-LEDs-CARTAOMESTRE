  }

    flex-direction: column; 
    overflow: hidden;
  }

  #search { 
    width: 100%; 
    background: #0a0a0f; 
    border: 1px solid #333; 
    color: #e0e0e0;

    border-radius: 8px; 
    font-size: 13px;

    padding: 6px 12px; 
    border-bottom: 1px solid #1a1a2e; 
    display: none; 
  }
  .search-item { 
    padding: 6px 8px; 
    cursor: pointer; 
    border-radius: 4px; 
    font-size: 12px; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis;
    transition: background 0.2s;
  }
  .search-item:hover { background: #1a1a2e; }

    font-size: 11px;

  #info-content .field b { color: #fff; }
  #info-content .empty { color: #444; font-style: italic; }
  .neighbor-link { 
    display: block; 
    padding: 4px 8px; 
    margin: 3px 0; 
    border-radius: 4px; 
    cursor: pointer; 
    font-size: 12px; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    border-left: 3px solid #333;
    transition: background 0.2s, padding-left 0.2s;
  }
  .neighbor-link:hover { 
    background: #1a1a2e; 
    padding-left: 12px;
  }
  #neighbors-list { max-height: 180px; overflow-y: auto; margin-top: 8px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 16px; }
  #legend-wrap h3 {

    color: #ff00ff; 
    margin-bottom: 12px; 
    text-transform: uppercase; 
    letter-spacing: 0.1em;
    text-shadow: 0 0 10px rgba(255,0,255,0.5);

    display: flex; 
    align-items: center; 
    gap: 10px; 
    padding: 6px 8px; 
    cursor: pointer; 
    border-radius: 6px; 
    font-size: 12px;
    transition: background 0.2s, padding-left 0.2s;
  }
  .legend-item:hover { background: #1a1a2e; padding-left: 12px; }
  .legend-item.dimmed { opacity: 0.3; }
  .legend-dot { 
    width: 14px; 
    height: 14px; 
    border-radius: 50%; 
    flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;

  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { color: #555; font-size: 11px; }
  #stats {

    border-top: 1px solid #1a1a2e; 
    font-size: 11px; 
    color: #444;
    background: #0a0a0f;
  }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title,
  _community: n.community, _community_name: n.community_name,
  _source_file: n.source_file, _file_type: n.file_type, _degree: n.degree,
  borderWidth: 2,
  shadow: { enabled: true, size: 12, x: 0, y: 0, color: n.color.background }
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width,
  color: { color: e.color, highlight: e.color, hover: e.color, opacity: 0.9 },
  arrows: { to: { enabled: true, scaleFactor: 0.6, color: e.color } },
  shadow: { enabled: true, size: 6, x: 0, y: 0, color: e.color }
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -80,
      centralGravity: 0.01,
      springLength: 150,
      springConstant: 0.08,
      damping: 0.4,
      avoidOverlap: 0.8,
    },
    stabilization: { iterations: 300, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: false,
    navigationButtons: true,
    keyboard: true,
  },
  nodes: { 
    shape: 'dot', 
    borderWidth: 2,
    scaling: { min: 8, max: 30 }
  },
  edges: { 
    smooth: { type: 'continuous', roundness: 0.3 }, 
    selectionWidth: 4 
  },
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" onclick="focusNode(${JSON.stringify(nid)})">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field" style="margin-bottom:10px"><b style="font-size:15px;text-shadow:0 0 10px ${esc(n.color.background)}">${esc(n.label)}</b></div>
    <div class="field">Tipo: <b>${esc(n._file_type || 'desconhecido')}</b></div>
    <div class="field">Comunidade: <b>${esc(n._community_name)}</b></div>
    <div class="field">Conexões: <b>${n._degree}</b></div>
    ${neighborIds.length ? `<div style="margin-top:10px;color:#666;font-size:11px;text-transform:uppercase;letter-spacing:0.05em">Vizinhos (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});
container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
    showInfo(hoveredNodeId);
    network.selectNodes([hoveredNodeId]);
  }
});
network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    document.getElementById('info-content').innerHTML = '<span class="empty">Clique em um nó para ver detalhes</span>';
  }
});

  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.boxShadow = `0 0 5px ${n.color.background}40`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      network.focus(n.id, { scale: 1.5, animation: true });
      network.selectNodes([n.id]);
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

const hiddenCommunities = new Set();
const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="legend-dot" style="background:${c.color};box-shadow:0 0 8px ${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.onclick = () => {
    if (hiddenCommunities.has(c.cid)) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: hiddenCommunities.has(c.cid) }));
    nodesDS.update(updates);
  };
  legendEl.appendChild(item);
});
</script>
<script>
const hyperedges = [
  {"id": "access_control_hardware", "label": "Hardware Stack", "nodes": ["esp32_microcontroller", "rfid_rc522_reader", "relay_module", "lcd_display"], "color": "#00ffff"},
  {"id": "ota_web_interface", "label": "OTA Web Interface", "nodes": ["main_page", "upload_page", "access_page"], "color": "#ff00cc"},
  {"id": "software_libraries", "label": "Libraries", "nodes": ["mfrc522_library", "liquidcrystal_i2c_library"], "color": "#aa00ff"}
];

network.on('afterDrawing', function(ctx) {
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.08;
        ctx.fillStyle = h.color;
        ctx.strokeStyle = h.color;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
            x: cx + (p.x - cx) * 1.2,
            y: cy + (p.y - cy) * 1.2
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.3;
        ctx.stroke();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = h.color;
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = h.color;
        ctx.shadowBlur = 10;
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
    });
});

network.on('zoom', function() {
    network.redraw();
});
</script>
